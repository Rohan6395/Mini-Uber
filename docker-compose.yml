version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: appdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  user-service:
    build: ./user-service
    ports:
      - "5001:5001"
    depends_on:
      - rabbitmq
      - postgres

  ride-service:
    build: ./ride-service
    ports:
      - "5002:5002"
    depends_on:
      - rabbitmq
      - redis

  driver-service:
    build: ./driver-service
    ports:
        - "7001:7001"
    depends_on:
        - rabbitmq
        - redis

  payment-service:
    build: ./payment-service
    ports:
      - "5003:5003"
    depends_on:
      - rabbitmq

  notification-service:
    build: ./notification-service
    depends_on:
      - rabbitmq

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:80"

  redis:
    image: redis:7
    ports:
      - "6379:6379"


volumes:
  postgres_data:
