apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: cab-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: brahman1101/cab-api-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
      initContainers:
        - name: wait-for-services
          image: busybox:1.35
          command: ['sh', '-c', "until nc -z user-service 5001 && nc -z ride-service 5002 && nc -z driver-service 7001 && nc -z payment-service 5003; do echo waiting for services; sleep 2; done"]
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: cab-system
spec:
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 80
      name: http
  type: LoadBalancer
