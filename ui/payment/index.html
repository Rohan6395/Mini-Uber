<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CabNet — Payments</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <header class="header">
      <div class="logo">
        <span class="logo-icon">💳</span>
        <span class="logo-text">CabNet — Payment Service</span>
      </div>
    </header>

    <main class="main-content">
      <section class="hero">
        <h1 class="hero-title">Payments</h1>
        <p class="hero-subtitle">Payment Service • Port 8084 • Backend → :5003/pay</p>
      </section>

      <div class="payment-card">
        <div class="card-header">
          <h2>💰 Process Payment</h2>
          <p>Send payment event — backend publishes PAYMENT_SUCCESS to NOTIFICATIONS queue</p>
        </div>

        <form class="payment-form" id="paymentForm">
          <div class="form-group">
            <label for="paymentId">Payment ID</label>
            <input type="text" id="paymentId" placeholder="e.g. pay-001" required class="form-input" />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="userId">User ID</label>
              <input type="text" id="userId" placeholder="e.g. u1" required class="form-input" />
            </div>
            <div class="form-group">
              <label for="amount">Amount (₹)</label>
              <input type="number" id="amount" placeholder="200" required class="form-input" min="1" />
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="payBtn">
            <span>Process Payment</span>
            <span class="btn-icon">→</span>
          </button>
        </form>
      </div>

      <div class="response-card" id="responseCard" style="display: none;">
        <div class="response-header">
          <h3>API Response</h3>
          <button class="close-btn" id="closeResponseBtn">&times;</button>
        </div>
        <pre id="output" class="response-content"></pre>
      </div>
    </main>

    <footer class="footer">
      <p>&copy; 2025 CabNet — Microservices Ride Platform</p>
    </footer>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script src="script.js"></script>
</body>

</html>
